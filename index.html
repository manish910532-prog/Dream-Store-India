<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Store India | Luxury & Lifestyle</title>
  <style>
    :root {
      --bg-dark: #0f1115;
      --card-bg: #161a22;
      --gold-primary: #d4af37;
      --gold-hover: #f3e5ab;
      --text-main: #f0f3f6;
      --text-muted: #8b949e;
      --border-color: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Luxury Header */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-badge {
      background: linear-gradient(135deg, #d4af37, #aa8010);
      color: #000;
      font-weight: 900;
      font-size: 20px;
      padding: 8px 12px;
      border-radius: 8px;
      letter-spacing: 1px;
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
    }

    .brand-info {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .brand-slogan {
      font-size: 11px;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .search-bar {
      flex: 1;
      max-width: 500px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 6px;
      color: var(--text-main);
      outline: none;
      font-size: 14px;
      transition: border 0.3s;
    }

    .search-bar input:focus {
      border-color: var(--gold-primary);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-login {
      background-color: var(--gold-primary);
      color: #000;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }

    .btn-login:hover {
      background-color: var(--gold-hover);
    }

    /* Main Container */
    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
      flex: 1;
      width: 100%;
    }

    .catalog-title {
      font-size: 22px;
      margin-bottom: 24px;
      border-left: 4px solid var(--gold-primary);
      padding-left: 12px;
      font-weight: 700;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 24px;
    }

    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold-primary);
    }

    .product-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #21262d;
    }

    .product-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .product-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
      flex: 1;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 14px;
    }

    .current-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold-primary);
    }

    .original-price {
      font-size: 13px;
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .btn-buy {
      width: 100%;
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-buy:hover {
      background: var(--gold-primary);
      color: #000;
    }

    /* Empty/Loading State */
    .status-msg {
      text-align: center;
      padding: 50px 0;
      color: var(--text-muted);
      font-size: 16px;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="nav-container">
      <a href="#" class="brand-section">
        <div class="brand-badge">DSI</div>
        <div class="brand-info">
          <span class="brand-name">Dream Store India</span>
          <span class="brand-slogan">Elegance Delivered to Your Doorstep</span>
        </div>
      </a>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search for luxury items, collections..." oninput="filterItems()">
      </div>

      <div class="nav-actions">
        <button class="btn-login" onclick="alert('Login System Active')">Login / Sign Up</button>
      </div>
    </div>
  </header>

  <!-- Main Store Section -->
  <main>
    <h2 class="catalog-title">Trending Luxury Collections</h2>
    <div class="product-grid" id="productGrid">
      <div class="status-msg">Loading collections...</div>
    </div>
  </main>

  <script>
    let allProducts = [];

    // Auto-fetch products on page load
    window.addEventListener('DOMContentLoaded', () => {
      fetch('/api/products')
        .then(res => {
          if (!res.ok) throw new Error("Catalog fetch failed");
          return res.json();
        })
        .then(data => {
          allProducts = data;
          renderCards(data);
        })
        .catch(err => {
          console.warn("API offline, using fallback products", err);
          // Fallback demo data in case products.json is empty
          allProducts = [
            {
              id: "1",
              name: "Royal Velvet Kurta",
              price: "₹2,499",
              original: "₹4,999",
              image: "https://images.unsplash.com/photo-1598033129183-c4f50c736f10?w=500&q=80",
              description: "Handcrafted artisan luxury finish with gold zari embroidery."
            },
            {
              id: "2",
              name: "Signature Derby Shoes",
              price: "₹3,999",
              original: "₹6,999",
              image: "https://images.unsplash.com/photo-1533867617858-e7b97e060509?w=500&q=80",
              description: "Pure Italian burnished leather with cushioned sole."
            },
            {
              id: "3",
              name: "Luxe Gold Chain Bracelet",
              price: "₹1,299",
              original: "₹2,599",
              image: "https://images.unsplash.com/photo-1611591475166-2679262145b0?w=500&q=80",
              description: "Premium polish stainless steel with royal matte accents."
            }
          ];
          renderCards(allProducts);
        });
    });

    function renderCards(items) {
      const grid = document.getElementById('productGrid');
      if (!items || items.length === 0) {
        grid.innerHTML = '<div class="status-msg">No products found matching your search.</div>';
        return;
      }

      grid.innerHTML = items.map(p => `
        <div class="product-card">
          <img src="${p.image || 'https://via.placeholder.com/300x220'}" class="product-img" alt="${p.name}">
          <div class="product-info">
            <h3 class="product-name">${p.name}</h3>
            <p class="product-desc">${p.description || ''}</p>
            <div class="price-row">
              <span class="current-price">${p.price}</span>
              ${p.original ? `<span class="original-price">${p.original}</span>` : ''}
            </div>
            <button class="btn-buy" onclick="alert('Proceeding to order: ${p.name}')">Order Now</button>
          </div>
        </div>
      `).join('');
    }

    function filterItems() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProducts.filter(p => 
        p.name.toLowerCase().includes(query) || 
        (p.description && p.description.toLowerCase().includes(query))
      );
      renderCards(filtered);
    }
  </script>
</body>
</html>
